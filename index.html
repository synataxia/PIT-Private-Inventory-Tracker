<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIT - Private Inventory Tracker</title>
  <style>
    :root{--bg:#0f172a;--panel:#111827;--panel2:#1f2937;--text:#e5e7eb;--muted:#9ca3af;--accent:#22c55e;--accent2:#16a34a;--border:#374151}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#0b1220,#0f172a);color:var(--text)}
    header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);background:rgba(17,24,39,.85);position:sticky;top:0;backdrop-filter:blur(12px)}
    h1{margin:0;font-size:1.25rem}
    .wrap{max-width:1100px;margin:0 auto;padding:1rem;display:grid;gap:1rem}
    .card{background:rgba(17,24,39,.95);border:1px solid var(--border);border-radius:16px;padding:1rem;box-shadow:0 10px 30px rgba(0,0,0,.2)}
    label{display:block;font-size:.92rem;margin:.75rem 0 .35rem;color:#cbd5e1}
    input,select,textarea,button{font:inherit}
    input,select,textarea{width:100%;padding:.75rem;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}
    textarea{min-height:96px;resize:vertical}
    button{padding:.75rem 1rem;border:0;border-radius:12px;background:var(--accent);color:#052e16;font-weight:700;cursor:pointer}
    button.secondary{background:#334155;color:var(--text);border:1px solid var(--border)}
    button:hover{filter:brightness(1.05)}
    .grid{display:grid;gap:1rem}
    .grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
    .muted{color:var(--muted)}
    .pill{display:inline-block;padding:.3rem .6rem;border-radius:999px;background:#064e3b;color:#bbf7d0;font-size:.85rem}
    .list{display:grid;gap:.75rem}
    .item{padding:.9rem;border:1px solid var(--border);border-radius:14px;background:#0b1220}
    .item h3{margin:.1rem 0 .35rem;font-size:1rem}
    .item small{color:var(--muted)}
    .thumb{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--border);background:#111827}
    .split{display:grid;grid-template-columns:1.2fr .8fr;gap:1rem}
    .status{margin-top:.75rem;padding:.75rem;border-radius:12px;background:#052e16;color:#bbf7d0;border:1px solid #14532d}
    .danger{background:#3f1d1d;color:#fecaca;border-color:#7f1d1d}
    .actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}
    .history{font-size:.9rem;display:grid;gap:.35rem}
    .history div{padding:.5rem .7rem;border-radius:10px;background:#111827;border:1px solid var(--border)}
    @media (max-width: 900px){.grid.two,.grid.three,.split{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <h1>PIT — Private Inventory Tracker</h1>
    <div class="muted">Web app for barcode lookup, quick inventory addition, and local saving.</div>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="grid two">
        <div>
          <label for="barcode">Barcode / UPC / ISBN</label>
          <input id="barcode" placeholder="Scan or type a code" inputmode="numeric" autocomplete="off" />
        </div>
        <div>
          <label for="source">Lookup source</label>
          <select id="source">
            <option value="auto">Auto</option>
            <option value="upc">UPC / product</option>
            <option value="isbn">ISBN / books</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button id="lookupBtn">Lookup</button>
        <button class="secondary" id="saveBtn">Save item</button>
        <button class="secondary" id="nextBtn">Save & next</button>
      </div>
      <div id="lookupStatus" class="status">Ready.</div>
    </section>

    <section class="split">
      <section class="card">
        <h2 style="margin-top:0">Item details</h2>
        <div class="grid two">
          <div><label for="name">Name</label><input id="name" /></div>
          <div><label for="brand">Brand / Author</label><input id="brand" /></div>
          <div><label for="category">Category</label><input id="category" /></div>
          <div><label for="quantity">Quantity</label><input id="quantity" type="number" min="1" value="1" /></div>
        </div>
        <div class="grid two">
          <div><label for="location">Location</label><input id="location" placeholder="Shelf, bin, room" /></div>
          <div><label for="variant">Duplicate / variant</label><input id="variant" placeholder="Original, duplicate, alt cover" /></div>
        </div>
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Condition, shelf, extra details"></textarea>
      </section>

      <section class="card">
        <h2 style="margin-top:0">Current result</h2>
        <div id="result" class="item muted">No lookup yet.</div>
        <div style="height:1rem"></div>
        <label for="photo">Photo</label>
        <input id="photo" type="file" accept="image/*" capture="environment" />
        <div style="height:.75rem"></div>
        <img id="preview" class="thumb" alt="Preview" style="display:none" />
      </section>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">Collection</h2>
        <span id="count" class="pill">0 items</span>
      </div>
      <div id="collection" class="list" style="margin-top:1rem"></div>
    </section>

    <section class="card">
      <h2 style="margin-top:0">Tools</h2>
      <div class="actions">
        <button id="exportJson">Export JSON</button>
        <button id="exportCsv">Export CSV</button>
        <button class="secondary" id="importBtn">Import file</button>
        <input id="file" type="file" accept=".json,.csv" hidden />
        <button class="secondary" id="clearBtn">Clear all</button>
        <button class="secondary" id="seedBtn">Load sample</button>
      </div>
      <div class="status" id="storageStatus">Saved locally in your browser.</div>
    </section>

    <section class="card">
      <h2 style="margin-top:0">Recent scans</h2>
      <div id="history" class="history"></div>
    </section>
  </main>

  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const refs = {
      barcode: $('barcode'), source: $('source'), lookupBtn: $('lookupBtn'), saveBtn: $('saveBtn'), nextBtn: $('nextBtn'),
      lookupStatus: $('lookupStatus'), name: $('name'), brand: $('brand'), category: $('category'), quantity: $('quantity'),
      location: $('location'), variant: $('variant'), notes: $('notes'), result: $('result'), photo: $('photo'), preview: $('preview'),
      collection: $('collection'), count: $('count'), exportJson: $('exportJson'), exportCsv: $('exportCsv'), importBtn: $('importBtn'),
      file: $('file'), clearBtn: $('clearBtn'), seedBtn: $('seedBtn'), history: $('history'), storageStatus: $('storageStatus')
    };

    const DB = 'pit-db';
    const STORE = 'items';
    const state = { items: [], history: [], current: null, pendingPhoto: '' };

    const openDB = () => new Promise((resolve, reject) => {
      const req = indexedDB.open(DB, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE, { keyPath: 'barcode' });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });

    const dbAll = async () => {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    };

    const dbPut = async item => {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(item);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const dbClear = async () => {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const esc = s => String(s ?? '').replace(/[&<>"]+/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

    function status(msg, danger=false){ refs.lookupStatus.textContent = msg; refs.lookupStatus.className = 'status' + (danger ? ' danger' : ''); }
    function setResult(obj){
      if(!obj){ refs.result.textContent = 'No lookup yet.'; return; }
      refs.result.innerHTML = `<h3>${esc(obj.name || 'Unknown item')}</h3><div><strong>Barcode:</strong> ${esc(obj.barcode || '')}</div><div><strong>Brand/Author:</strong> ${esc(obj.brand || '')}</div><div><strong>Category:</strong> ${esc(obj.category || '')}</div><div><strong>Source:</strong> ${esc(obj.source || 'Manual')}</div>`;
    }

    function fillForm(data={}, append=false){
      const set = (el, val) => { if(append && el.value) return; el.value = val || ''; };
      set(refs.name, data.name); set(refs.brand, data.brand); set(refs.category, data.category);
      if(!(append && refs.quantity.value)) refs.quantity.value = data.quantity || 1;
      set(refs.location, data.location); set(refs.variant, data.variant); set(refs.notes, data.notes);
      if(data.photo){ refs.preview.src = data.photo; refs.preview.style.display = 'block'; }
    }

    function toItem(){
      return {
        barcode: refs.barcode.value.trim(),
        name: refs.name.value.trim(),
        brand: refs.brand.value.trim(),
        category: refs.category.value.trim(),
        quantity: Number(refs.quantity.value) || 1,
        location: refs.location.value.trim(),
        variant: refs.variant.value.trim(),
        notes: refs.notes.value.trim(),
        photo: state.pendingPhoto || '',
        updatedAt: new Date().toISOString()
      };
    }

    function render(){
      refs.count.textContent = `${state.items.length} item${state.items.length===1?'':'s'}`;
      refs.collection.innerHTML = state.items.length ? state.items.map((i, idx) => `
        <div class="item">
          ${i.photo ? `<img class="thumb" src="${i.photo}" alt="${esc(i.name)}">` : `<div class="thumb"></div>`}
          <div>
            <h3>${esc(i.name)}</h3>
            <div><small>${esc(i.barcode)} · ${esc(i.brand || 'No brand')} · ${esc(i.category || 'Unsorted')}</small></div>
            <div><small>Qty ${esc(i.quantity)} · ${esc(i.location || 'No location')} · ${esc(i.variant || 'Primary')}</small></div>
            ${i.notes ? `<div><small>${esc(i.notes)}</small></div>` : ''}
          </div>
          <button class="secondary" data-remove="${idx}">Remove</button>
        </div>
      `).join('') : '<div class="muted">No items saved yet.</div>';
      refs.collection.querySelectorAll('[data-remove]').forEach(btn => btn.onclick = async () => {
        state.items.splice(Number(btn.dataset.remove), 1);
        await saveAll();
      });
      refs.history.innerHTML = state.history.slice(0,10).map(h => `<div>${esc(h.time)} — ${esc(h.msg)}</div>`).join('') || '<div class="muted">No scans yet.</div>';
    }

    async function saveAll(){
      for(const item of state.items) await dbPut(item);
      render();
      status('Saved locally in your browser.');
    }

    function normalizeUPC(data){
      const item = data?.items?.[0] || data?.product || data || {};
      return {
        name: item.title || item.product_name || item.name || '',
        brand: item.brand || item.manufacturer || item.author_name || '',
        category: item.category || item.category_name || 'Unsorted',
        photo: item.image || item.image_url || '',
        notes: item.ingredients_text || item.description || '',
        source: 'UPC/Product'
      };
    }

    async function lookupBarcode(barcode){
      const existing = state.items.find(i => i.barcode === barcode);
      if(existing){
        state.current = existing;
        fillForm(existing, refs.source.value === 'append');
        setResult({...existing, source:'Saved collection'});
        status('Found in saved collection.');
        return;
      }

      status('Looking up barcode...');
      const src = refs.source.value;
      const tries = [];
      if(src !== 'isbn') tries.push(['UPCitemdb', `https://api.upcitemdb.com/prod/trial/lookup?upc=${encodeURIComponent(barcode)}`]);
      if(src === 'auto' || src === 'upc') tries.push(['Open Food Facts', `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(barcode)}.json`]);
      if(src !== 'upc') tries.push(['Open Library', `https://openlibrary.org/search.json?isbn=${encodeURIComponent(barcode)}`]);

      for(const [source, url] of tries){
        try{
          const r = await fetch(url, { headers: { Accept: 'application/json' } });
          if(!r.ok) continue;
          const j = await r.json();
          let found = null;
          if(source === 'UPCitemdb' && j.code === 'OK' && j.items?.length) found = normalizeUPC(j.items[0]);
          if(source === 'Open Food Facts' && j.status === 1 && j.product) found = normalizeUPC({product: j.product});
          if(source === 'Open Library' && j.docs?.length) found = {
            name: j.docs[0].title || '',
            brand: (j.docs[0].author_name || []).join(', '),
            category: 'Books',
            photo: '',
            notes: '',
            source
          };
          if(found){
            state.current = { barcode, ...found, source };
            fillForm(state.current, refs.source.value === 'append');
            setResult(state.current);
            state.history.unshift({ time: new Date().toLocaleTimeString(), msg: `Found via ${source}: ${barcode}` });
            render();
            status(`Lookup succeeded via ${source}.`);
            return;
          }
        }catch(e){}
      }

      state.current = { barcode, source:'Manual' };
      setResult({ barcode, name:'No database match', source:'Manual' });
      status('No match found. Fill in details manually.', true);
    }

    async function saveItem(){
      const item = toItem();
      if(!item.barcode){ status('Scan or type a barcode first.', true); return; }
      if(!item.name){ status('Add a name first.', true); return; }
      const idx = state.items.findIndex(i => i.barcode === item.barcode);
      if(idx >= 0) state.items[idx] = item; else state.items.unshift(item);
      state.history.unshift({ time: new Date().toLocaleTimeString(), msg: `Saved ${item.barcode}` });
      state.pendingPhoto = '';
      await saveAll();
    }

    async function exportJson(){
      const blob = new Blob([JSON.stringify(state.items, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'pit-export.json'; a.click();
    }

    async function exportCsv(){
      const headers = ['barcode','name','brand','category','quantity','location','variant','notes'];
      const rows = [headers.join(',')].concat(state.items.map(i => headers.map(h => `"${String(i[h] ?? '').replace(/"/g,'""')}"`).join(',')));
      const blob = new Blob([rows.join('
')], { type: 'text/csv' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'pit-export.csv'; a.click();
    }

    async function importFile(file){
      const text = await file.text();
      if(file.name.toLowerCase().endsWith('.json')){
        const data = JSON.parse(text);
        const items = Array.isArray(data) ? data : data.items || [];
        items.forEach(item => { if(item.barcode) state.items.unshift(item); });
      }else{
        const lines = text.trim().split(/?
/);
        const headers = lines.shift().split(',').map(s => s.trim().replace(/^"|"$/g,''));
        lines.forEach(line => {
          const cols = line.match(/("[^"]*"|[^,]+)/g)?.map(s => s.replace(/^"|"$/g,'')) || [];
          const obj = {};
          headers.forEach((h,i) => obj[h] = cols[i] || '');
          if(obj.barcode) state.items.unshift(obj);
        });
      }
      await saveAll();
      status('Import complete.');
    }

    async function load(){
      state.items = await dbAll();
      render();
    }

    refs.lookupBtn.onclick = () => lookupBarcode(refs.barcode.value.trim());
    refs.barcode.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); lookupBarcode(refs.barcode.value.trim()); } };
    refs.saveBtn.onclick = saveItem;
    refs.nextBtn.onclick = async () => { await saveItem(); refs.barcode.value=''; refs.barcode.focus(); };
    refs.photo.onchange = e => {
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => { state.pendingPhoto = r.result; refs.preview.src = r.result; refs.preview.style.display = 'block'; status('Photo attached.'); };
      r.readAsDataURL(f);
    };
    refs.exportJson.onclick = exportJson;
    refs.exportCsv.onclick = exportCsv;
    refs.importBtn.onclick = () => refs.file.click();
    refs.file.onchange = e => { const f = e.target.files[0]; if(f) importFile(f); };
    refs.clearBtn.onclick = async () => { state.items = []; await dbClear(); render(); status('All items cleared.'); };
    refs.seedBtn.onclick = async () => {
      state.items = [
        { barcode:'4902778912345', name:'Marker Set', brand:'Uni', category:'Art', quantity:2, location:'Desk', variant:'Primary', notes:'Sample item' },
        { barcode:'9780140328721', name:'Matilda', brand:'Roald Dahl', category:'Books', quantity:1, location:'Shelf A', variant:'Hardcover', notes:'Sample book' }
      ];
      await saveAll();
      status('Sample data loaded.');
    };

    load();
  })();
  </script>
</body>
</html>
